<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOOT | 예측을 쏘다</title>
    <script src="https://ethers.io"></script>
    <style>
        /* MZ 스타일의 다크 & 네온 테마 */
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .logo { font-size: 6rem; font-weight: 900; letter-spacing: -4px; color: #00f2ff; text-shadow: 0 0 20px #00f2ff; margin-bottom: 5px; }
        .tagline { font-size: 1.2rem; color: #888; margin-bottom: 40px; letter-spacing: 2px; }
        .btn-connect { background: #00f2ff; color: #000; border: none; padding: 18px 45px; font-size: 1.2rem; font-weight: 800; border-radius: 12px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3); }
        .btn-connect:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 25px rgba(0, 242, 255, 0.5); }
        #walletAddress { margin-top: 25px; font-family: monospace; color: #00f2ff; opacity: 0.8; }
        /* 배경 애니메이션 효과 */
        .bg-glow { position: absolute; width: 300px; height: 300px; background: #00f2ff; filter: blur(150px); opacity: 0.1; z-index: -1; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="logo">ZOOT</div>
    <div class="tagline">SHOOT YOUR PREDICTION</div>

    <button id="connectBtn" class="btn-connect">CONNECT WALLET</button>
    <div id="walletAddress">Not Connected</div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletAddress = document.getElementById('walletAddress');

        connectBtn.onclick = async () => {
            if (window.ethereum) {
                try {
                    // 메타마스크 지갑 연결 요청
                    const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    
                    // 연결된 주소 표시
                    walletAddress.innerText = `READY TO ZOOT: ${account.substring(0, 6)}...${account.substring(38)}`;
                    connectBtn.innerText = "ZOOTED ON";
                    connectBtn.style.background = "#fff";
                } catch (err) {
                    walletAddress.innerText = "Connection Denied";
                }
            } else {
                alert("Please install MetaMask to Zoot!");
            }
        };
    </script>
</body>
</html>
